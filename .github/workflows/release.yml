name: Release Cloudflare MKP

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all tags and commits, needed for the changelog

      - uses: haxe18/Check_MK-plugin_mpk_action@v1
        with:
          plugin_name: "cloudflare"
          title: "Cloudflare Monitoring"
          description: "Cloudflare Monitoring Plugin - monitors Cloudflare usage/metrics."
          tag_prefix: "v"
          usable_until: "3.0.0"  # Checkmk 3.0 is not covered, see README "Requirements"
          changelog_filter_path: "cloudflare/"
